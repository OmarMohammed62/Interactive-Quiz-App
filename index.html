<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>Interactive Quiz</h1>
        <div class="quiz-header">
            <span class="question-number">Question 1 of 10</span>
            <span class="score">Score: 0</span>
        </div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <div class="quiz-content">
            <h2 class="question">What is JavaScript?</h2>
            <div class="answers">
                <button class="answer">Programming Language</button>
                <button class="answer">Markup Language</button>
                <button class="answer">Styling Language</button>
                <button class="answer">Database</button>
            </div>
        </div>
        <button class="next-btn">Next Question</button>
        <button class="restart-btn">Restart Quiz</button>
        <button class="previous-btn">Previous Question</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
